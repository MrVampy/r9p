[workspace]
members = [
    "crates/auth",
    "crates/beam-port",
    "crates/core",
    "crates/cli",
    "crates/fs",
    "crates/fuse",
    "crates/front",
    "crates/session",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"
repository = "https://github.com/MrVampy/r9p"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[workspace.dependencies]
front = { version = "0.1.0", path = "crates/front" }
fuse = { version = "0.1.0", path = "crates/fuse" }
fs = { version = "0.1.0", path = "crates/fs" }
libc = "=0.2.186"
r9p = { version = "0.1.0", path = "crates/core" }
r9p-auth = { version = "0.1.0", path = "crates/auth" }
serde_json = { version = "1", default-features = false, features = ["std"] }
session = { version = "0.1.0", path = "crates/session" }
snow = { version = "=0.10.0", default-features = false, features = [
    "std",
    "use-blake2",
    "use-chacha20poly1305",
    "use-curve25519",
    "use-getrandom",
] }
